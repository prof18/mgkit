interface:
  display_name: "Review and Fix"
  short_description: "Run a graded, budget-conscious review-fix-verify pass across a codebase."
  default_prompt: "Use $review-and-fix to run one review pass: a panel of the other installed agent CLIs moderated by you for up to 3 rounds (or 1-3 fresh-context reviewer agents when none is installed), verify and grade findings yourself, discard low-confidence and low-importance findings, fix confirmed medium-or-higher issues with a single worker, preserve the starting commit posture, and report the findings funnel, the panel and verification."
