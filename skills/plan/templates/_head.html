<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f6f1e7;--fg:#1f1b16;--muted:#6b6257;--rule:#d9cfbf;--accent:#b8420f;--code:#ece4d6}
@media (prefers-color-scheme:dark){:root{--bg:#16130f;--fg:#eee6d9;--muted:#a39888;--rule:#3a332a;--accent:#f08a4b;--code:#221d17}}
body{background:var(--bg);color:var(--fg);font:16px/1.6 "Iowan Old Style","Charter",Georgia,serif;max-width:52rem;margin:0 auto;padding:2rem 1rem 5rem}
h1,h2,h3{font-family:"Avenir Next","Futura",sans-serif;line-height:1.2}
h1{font-size:2.2rem;border-bottom:4px solid var(--accent);padding-bottom:.4rem}
h2{margin-top:2.4rem;color:var(--accent)}
code,pre{font:14px/1.5 "JetBrains Mono","SF Mono",Menlo,monospace}
code{background:var(--code);padding:0 .25em;border-radius:3px}
pre{background:var(--code);padding:1rem;overflow-x:auto;border-left:3px solid var(--accent)}
pre code{padding:0;background:none}
table{border-collapse:collapse;width:100%;margin:1rem 0}
th,td{border-bottom:1px solid var(--rule);padding:.4rem .5rem;text-align:left;vertical-align:top}
th{font-family:"Avenir Next",sans-serif}
.rule{border:2px solid var(--accent);padding:.8rem 1rem;border-radius:6px}
.muted{color:var(--muted)}
a{color:var(--accent)}
</style>
